<!DOCTYPE html>
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h4>List Account</h4>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Id</th>
            <th>Username</th>
            <th>Password</th>
            <th>fullName</th>
            <th>Department</th>
        </tr>
    </thead>
    <tbody>

    </tbody>

</table>

<script>

$(function () { // giup cho phan script chay sau cung
$.ajax({
    type: "GET",
    url: `http://localhost:8080/account`,
    dataType: "JSON",
    success: function(res, xhr){
        console.log("Successfully");
        console.log(res); // data gui len api department in ra cac doi tuong

        // dua data vao cac tr, td
        let bodyContent = "";

        for (let i = 0; i < res.length; i++) {
            bodyContent += "<tr>";
            bodyContent += "    <td>" + res[i].id + "</td>"
            bodyContent += "    <td>" + res[i].username + "</td>"
            bodyContent += "    <td>" + res[i].password + "</td>"
            bodyContent += "    <td>" + res[i].fullName + "</td>"
            bodyContent += "    <td>" + res[i].department + "</td>"
            bodyContent += "</tr>";
        }
	$("tbody").append(bodyContent);
        },
    error: function (res){
        console.log("Error!");
        console.log(res);
    },
    });
});


</script>


</body>
</html>
