networks:
  demo-network:
    driver: bridge
services:
  app:
    build: .
    container_name: test
    networks:
      - demo-network
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/testingsystem_account
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0.30
    container_name: mysql
    networks:
      - demo-network
    ports:
      - "3306:3306"
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testingsystem_account
volumes:
  todo-mysql-data:











